name: Create release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  native-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gradle_version="$(awk -F= '/^VERSION_NAME=/{print $2}' gradle.properties)"
          test "$RELEASE_TAG" = "$gradle_version"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Verify generated documentation
        run: ./gradlew --no-daemon checkVersionedDocs

      - name: Validate standalone CocoaPods specification
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          podspec_url="https://raw.githubusercontent.com/EugenePonomarev/styled-qr-kmp/${RELEASE_TAG}/StyledQrKmp.podspec"
          curl --fail --location --silent --show-error "$podspec_url" --output /tmp/StyledQrKmp.podspec
          pod ipc spec /tmp/StyledQrKmp.podspec > /dev/null

      - name: Build the release XCFramework
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :qrcode-core:assembleStyledQrKmpReleaseXCFramework
          --stacktrace

      - name: Verify the public Swift API
        run: bash scripts/verify-ios-swift-api.sh

      - name: Archive the XCFramework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            qrcode-core/build/XCFrameworks/release/StyledQrKmp.xcframework \
            StyledQrKmp.xcframework.zip
          shasum -a 256 StyledQrKmp.xcframework.zip > StyledQrKmp.xcframework.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          StyledQrKmp.xcframework.zip
          StyledQrKmp.xcframework.sha256
          --title "Styled QR KMP ${GITHUB_REF_NAME}"
          --generate-notes

      - name: Validate the published CocoaPods artifact
        run: >-
          pod spec lint StyledQrKmp.podspec
          --allow-warnings
          --platforms=ios

  npm-web:
    needs: native-ios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gradle_version="$(awk -F= '/^VERSION_NAME=/{print $2}' gradle.properties)"
          test "$RELEASE_TAG" = "$gradle_version"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build and verify the npm package
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :qrcode-web:jsBrowserTest
          :qrcode-web:verifyJsNpmPackage
          :qrcode-web:packJsPackage
          --stacktrace

      - name: Use an npm CLI that supports trusted publishing
        run: npm install --global npm@11

      - name: Publish npm package
        run: npm publish ./qrcode-web/build/packages/js --access public