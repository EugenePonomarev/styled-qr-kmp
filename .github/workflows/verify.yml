name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-and-jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Verify generated documentation
        run: ./gradlew --no-daemon checkVersionedDocs

      - name: Run Android and JVM checks
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon
          :qrcode-core:apiCheck
          :qrcode-android-view:apiCheck
          :qrcode-compose:apiCheck
          :qrcode-core:jvmTest
          :qrcode-core:assembleDebug
          :qrcode-core:testDebugUnitTest
          :qrcode-android-view:assembleDebug
          :qrcode-compose:assembleDebug
          :qrcode-android-view:testDebugUnitTest
          :gallery-generator:test
          checkGallery
          --stacktrace

      - name: Build and verify documentation site
        run: ./gradlew --no-daemon checkDocsSite --stacktrace

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs-site

      - name: Run core JS browser tests
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon
          :qrcode-core:jsBrowserTest
          --stacktrace

      - name: Run Web JS browser tests
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon
          :qrcode-web:jsBrowserTest
          --stacktrace

      - name: Verify Web npm package
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon
          :qrcode-web:verifyJsNpmPackage
          :qrcode-web:packJsPackage
          --stacktrace

      - name: Set up Node for the TypeScript consumer
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Verify playground and generate Kotlin example
        run: node tests/playground/verify-playground.mjs --emit-kotlin

      - name: Compile and test generated Android examples
        run: |
          test -s tools/gallery-generator/build/generated/playground-tests/GeneratedPlaygroundKotlinTest.kt
          test -s qrcode-compose/build/generated/playground-tests/GeneratedPlaygroundCompose.kt
          test -s qrcode-android-view/build/generated/playground-tests/GeneratedPlaygroundViewTest.kt
          test -s tools/gallery-generator/build/generated/playground-swift/GeneratedPlayground.swift

          ./gradlew --no-daemon \
            :gallery-generator:test \
            :qrcode-compose:compileDebugUnitTestKotlin \
            :qrcode-android-view:testDebugUnitTest \
            --stacktrace

          test -f tools/gallery-generator/build/test-results/test/TEST-playground.generated.GeneratedPlaygroundKotlinTest.xml
          test -f qrcode-android-view/build/test-results/testDebugUnitTest/TEST-playground.generated.GeneratedViewXmlTest.xml
          find qrcode-compose/build -name GeneratedPlaygroundComposeKt.class -print -quit | grep -q .

      - name: Upload generated Swift example
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playground-swift-example
          path: tools/gallery-generator/build/generated/playground-swift/GeneratedPlayground.swift
          if-no-files-found: error
          retention-days: 14


      - name: Verify packed Web package with TypeScript
        run: npm --prefix tests/web-typescript test

      - name: Verify Maven publications used by JitPack
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :qrcode-core:publishKotlinMultiplatformPublicationToMavenLocal
          :qrcode-core:publishAndroidReleasePublicationToMavenLocal
          :qrcode-core:publishJvmPublicationToMavenLocal
          :qrcode-android-view:publishReleasePublicationToMavenLocal
          :qrcode-compose:publishReleasePublicationToMavenLocal
          -x test

  native-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run iOS renderer tests
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            IOS_TEST_TASK="iosSimulatorArm64Test"
          else
            IOS_TEST_TASK="iosX64Test"
          fi
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            ":qrcode-core:${IOS_TEST_TASK}" \
            --stacktrace

      - name: Print iOS test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for report in Path("qrcode-core/build/test-results").rglob("TEST-*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  for failure in case:
                      if failure.tag in {"failure", "error"}:
                          print(f"\nReport: {report}")
                          print(f"Test: {case.get('classname')}.{case.get('name')}")
                          print(failure.get("message", ""))
                          print(failure.text or "")
          PY

      - name: Build iOS XCFramework
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :qrcode-core:assembleStyledQrKmpReleaseXCFramework
          --stacktrace

      - name: Verify the public Swift API
        run: bash scripts/verify-ios-swift-api.sh

      - name: Run the Swift API on an iOS simulator
        run: bash scripts/test-ios-swift-api.sh

      - name: Archive the verified iOS framework
        run: |
          mkdir -p build/ios-ci-framework
          ditto -c -k --sequesterRsrc --keepParent \
            qrcode-core/build/XCFrameworks/release/StyledQrKmp.xcframework \
            build/ios-ci-framework/StyledQrKmp.xcframework.zip
          git rev-parse HEAD > build/ios-ci-framework/source-commit.txt
          awk -F= '/^VERSION_NAME=/{print $2}' gradle.properties > build/ios-ci-framework/library-version.txt
          (
            cd build/ios-ci-framework
            shasum -a 256 StyledQrKmp.xcframework.zip > StyledQrKmp.xcframework.sha256
          )

      - name: Upload the verified iOS framework
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-xcframework
          path: build/ios-ci-framework/
          retention-days: 14
          if-no-files-found: error

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-test-reports
          path: |
            qrcode-core/build/reports/tests/
            qrcode-core/build/test-results/
            build/ios-swift-tests/
          retention-days: 14
          if-no-files-found: ignore

  verify-playground-swift:
    needs: [ android-and-jvm, native-ios ]
    runs-on: macos-latest

    steps:
      - name: Download generated Swift example
        uses: actions/download-artifact@v8.0.2
        with:
          name: playground-swift-example
          path: build/playground-swift

      - name: Download verified iOS framework
        uses: actions/download-artifact@v8.0.2
        with:
          name: ios-xcframework
          path: build/ios-ci-framework

      - name: Type-check generated Swift example
        run: |
          set -euo pipefail

          ditto -x -k \
            build/ios-ci-framework/StyledQrKmp.xcframework.zip \
            build/playground-framework

          xcframework="build/playground-framework/StyledQrKmp.xcframework"
          simulator_slice=""

          for candidate in "$xcframework"/ios-*-simulator; do
            if test -d "$candidate"; then
              simulator_slice="$candidate"
              break
            fi
          done

          test -n "$simulator_slice"
          test -s build/playground-swift/GeneratedPlayground.swift

          case "$(uname -m)" in
            arm64) swift_target="arm64-apple-ios13.0-simulator" ;;
            x86_64) swift_target="x86_64-apple-ios13.0-simulator" ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac

          sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"

          xcrun --sdk iphonesimulator swiftc \
            -target "$swift_target" \
            -sdk "$sdk_path" \
            -F "$simulator_slice" \
            -framework StyledQrKmp \
            -typecheck build/playground-swift/GeneratedPlayground.swift

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ android-and-jvm, native-ios, verify-playground-swift]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4