name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-and-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Verify generated documentation
        run: ./gradlew --no-daemon checkVersionedDocs

      - name: Run Android, JVM, and Web checks
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon
          :qrcode-core:jvmTest
          :qrcode-core:assembleDebug
          :qrcode-android-view:assembleDebug
          :qrcode-compose:assembleDebug
          :qrcode-web:jsBrowserTest
          :qrcode-web:jsBrowserProductionWebpack
          --stacktrace

      - name: Verify Maven publications used by JitPack
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :qrcode-core:publishKotlinMultiplatformPublicationToMavenLocal
          :qrcode-core:publishAndroidReleasePublicationToMavenLocal
          :qrcode-core:publishJvmPublicationToMavenLocal
          :qrcode-android-view:publishReleasePublicationToMavenLocal
          :qrcode-compose:publishReleasePublicationToMavenLocal
          -x test

  native-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build iOS XCFramework
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :qrcode-core:assembleStyledQrKmpReleaseXCFramework
          --stacktrace

      - name: Verify the public Swift API
        run: bash scripts/verify-ios-swift-api.sh