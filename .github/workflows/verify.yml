name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-and-jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Verify generated documentation
        run: ./gradlew --no-daemon checkVersionedDocs

      - name: Run Android and JVM checks
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon
          :qrcode-core:apiCheck
          :qrcode-android-view:apiCheck
          :qrcode-compose:apiCheck
          :qrcode-core:jvmTest
          :qrcode-core:assembleDebug
          :qrcode-core:testDebugUnitTest
          :qrcode-android-view:assembleDebug
          :qrcode-compose:assembleDebug
          :qrcode-android-view:testDebugUnitTest
          --stacktrace

      - name: Run core JS browser tests
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon
          :qrcode-core:jsBrowserTest
          --stacktrace

      - name: Run Web JS browser tests
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon
          :qrcode-web:jsBrowserTest
          --stacktrace

      - name: Verify Web npm package
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon
          :qrcode-web:verifyJsNpmPackage
          :qrcode-web:packJsPackage
          --stacktrace

      - name: Verify Maven publications used by JitPack
        env:
          JITPACK: "true"
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :qrcode-core:publishKotlinMultiplatformPublicationToMavenLocal
          :qrcode-core:publishAndroidReleasePublicationToMavenLocal
          :qrcode-core:publishJvmPublicationToMavenLocal
          :qrcode-android-view:publishReleasePublicationToMavenLocal
          :qrcode-compose:publishReleasePublicationToMavenLocal
          -x test

  native-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run iOS renderer tests
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            IOS_TEST_TASK="iosSimulatorArm64Test"
          else
            IOS_TEST_TASK="iosX64Test"
          fi
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            ":qrcode-core:${IOS_TEST_TASK}" \
            --stacktrace

      - name: Print iOS test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for report in Path("qrcode-core/build/test-results").rglob("TEST-*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  for failure in case:
                      if failure.tag in {"failure", "error"}:
                          print(f"\nReport: {report}")
                          print(f"Test: {case.get('classname')}.{case.get('name')}")
                          print(failure.get("message", ""))
                          print(failure.text or "")
          PY

      - name: Build iOS XCFramework
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :qrcode-core:assembleStyledQrKmpReleaseXCFramework
          --stacktrace

      - name: Verify the public Swift API
        run: bash scripts/verify-ios-swift-api.sh

      - name: Run the Swift API on an iOS simulator
        run: bash scripts/test-ios-swift-api.sh

      - name: Archive the verified iOS framework
        run: |
          mkdir -p build/ios-ci-framework
          ditto -c -k --sequesterRsrc --keepParent \
            qrcode-core/build/XCFrameworks/release/StyledQrKmp.xcframework \
            build/ios-ci-framework/StyledQrKmp.xcframework.zip
          git rev-parse HEAD > build/ios-ci-framework/source-commit.txt
          awk -F= '/^VERSION_NAME=/{print $2}' gradle.properties > build/ios-ci-framework/library-version.txt
          (
            cd build/ios-ci-framework
            shasum -a 256 StyledQrKmp.xcframework.zip > StyledQrKmp.xcframework.sha256
          )

      - name: Upload the verified iOS framework
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-xcframework
          path: build/ios-ci-framework/
          retention-days: 14
          if-no-files-found: error

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-test-reports
          path: |
            qrcode-core/build/reports/tests/
            qrcode-core/build/test-results/
            build/ios-swift-tests/
          retention-days: 14
          if-no-files-found: ignore